name: CI_MultiThreading
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    permissions: write-all
    with:
      threads: auto
      max-workers: 2
      coverage: true
      # Optional: restrict matrix to Linux x64 only (defaults to all OS/arch)
      include-windows-x86: false
      include-linux-x86: false
      include-macos-x64: false
      include-macos-aarch64: false
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
